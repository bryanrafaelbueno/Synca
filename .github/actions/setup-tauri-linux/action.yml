name: Setup Tauri Linux system dependencies
description: >-
  Installs the system libraries required to compile and bundle the Tauri app
  on Linux (glib/gtk/webkit pkg-config files, C toolchain, NSIS/mingw for
  cross-bundling). Shared by every job that compiles Rust or packages.
runs:
  using: composite
  steps:
    - name: Install apt system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          curl \
          wget \
          file \
          pkg-config \
          patchelf \
          nsis \
          mingw-w64 \
          gcc-mingw-w64-x86-64 \
          g++-mingw-w64-x86-64 \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libssl-dev \
          libfuse2t64
